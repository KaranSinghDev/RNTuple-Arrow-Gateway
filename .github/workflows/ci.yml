name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "benchmark/results/**"
      - "**.md"
      - "CITATION.cff"
      - ".zenodo.json"
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Build & test (rag-env:v0.0.2)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/karansinghdev/rnarrow-dev:v0.0.2

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Test
        run: ctest --test-dir build/release --output-on-failure
