name: Docker dev image

# Rebuilds and pushes ghcr.io/karansinghdev/rnarrow-dev when the Dockerfile changes.
# Also triggerable manually (workflow_dispatch) when you bump ARROW_VERSION or add deps.
on:
  push:
    branches: [master, main]
    paths:
      - "docker/dev.Dockerfile"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push dev image to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          push: true
          # Pin the versioned tag AND update latest so ci.yml can reference either.
          tags: |
            ghcr.io/karansinghdev/rnarrow-dev:v0.0.2
            ghcr.io/karansinghdev/rnarrow-dev:latest
          # Layer cache: reuse layers from the last push to speed up Arrow rebuild.
          cache-from: type=registry,ref=ghcr.io/karansinghdev/rnarrow-dev:buildcache
          cache-to: type=registry,ref=ghcr.io/karansinghdev/rnarrow-dev:buildcache,mode=max
